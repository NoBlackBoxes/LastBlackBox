# Build the unified Zensical course website and deploy it to GitHub Pages.
#
# Prereq (one-time, manual): in repo Settings -> Pages, set Source to
# "GitHub Actions". Without this the deploy job will fail.
#
# Pull requests build the complete site without deploying it. Pushes to master
# and course-site-zensical build and deploy; course-site-zensical remains a
# temporary live preview until the feature branch is merged. workflow_dispatch
# allows reruns.
#
# Pages only serves one deployment at a time, so pushing to the preview branch
# overwrites whatever was last deployed from master and vice versa.

name: Deploy docs

on:
  pull_request:
  push:
    branches:
      - master
      - course-site-zensical
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build all sites
        run: uv run --locked python course/tools/build_all.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
